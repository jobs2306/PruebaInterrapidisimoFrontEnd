<div class="login-page">
  <div class="login-card">

    <h2 class="title">Iniciar sesión</h2>
    <p class="subtitle">Accede a tu cuenta de estudiante</p>

    <div class="form-group">
      <label>Correo</label>
      <input
        type="email"
        placeholder="correo@ejemplo.com"
        [(ngModel)]="email" />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          [(ngModel)]="password" />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="togglePasswordVisibility()">
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 2 12 2 12a20.29 20.29 0 0 1 5.06-5.94"></path>
            <path d="M9.9 4.24A10.64 10.64 0 0 1 12 4c7 0 10 8 10 8a20.26 20.26 0 0 1-2.16 3.19"></path>
            <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"></path>
            <path d="M1 1l22 22"></path>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" (click)="login()">
      Ingresar
    </button>

    <p class="link">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>

    <p class="error" *ngIf="error">{{ error }}</p>

  </div>
</div>
